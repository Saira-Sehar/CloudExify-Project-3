<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="DentAlign Admin Login - Secure access for clinic management">
    <title>DentAlign | Admin Login</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    
    <style>
        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--cream) 0%, #e8f5f3 50%, var(--cream) 100%);
        }
        
        [data-theme="dark"] .login-page {
            background: linear-gradient(135deg, #0f172a 0%, #0d2b2a 50%, #0f172a 100%);
        }
        
        .login-container {
            width: 100%;
            max-width: 440px;
            padding: 20px;
        }
        
        .login-card {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            padding: 40px;
            box-shadow: var(--shadow-lg);
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }
        
        .login-logo {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            font-weight: 700;
            color: var(--navy);
            margin-bottom: 8px;
        }
        
        [data-theme="dark"] .login-logo {
            color: var(--text-dark);
        }
        
        .login-subtitle {
            color: var(--text-light);
            font-size: 0.9rem;
            margin: 0;
        }
        
        .login-icon-circle {
            width: 72px;
            height: 72px;
            background: rgba(13, 148, 136, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 2rem;
            color: var(--teal);
        }
        
        .form-label {
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-dark);
            margin-bottom: 6px;
        }
        
        .form-control {
            background: var(--cream);
            border: 1px solid var(--border);
            color: var(--text-dark);
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            transition: var(--transition);
        }
        
        .form-control:focus {
            border-color: var(--teal);
            box-shadow: 0 0 0 3px var(--teal-glow);
        }
        
        .input-group-text {
            background: var(--cream);
            border: 1px solid var(--border);
            color: var(--text-light);
        }
        
        .btn-login {
            width: 100%;
            padding: 14px;
            font-size: 1rem;
            font-weight: 600;
        }
        
        .login-error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: var(--danger);
            padding: 10px 16px;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            margin-bottom: 16px;
            display: none;
        }
        
        .login-error.show {
            display: block;
            animation: shake 0.5s ease;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            60% { transform: translateX(-6px); }
            80% { transform: translateX(6px); }
        }
        
        .back-link {
            text-align: center;
            margin-top: 20px;
        }
        
        .back-link a {
            color: var(--text-light);
            text-decoration: none;
            font-size: 0.85rem;
            transition: var(--transition);
        }
        
        .back-link a:hover {
            color: var(--teal);
        }
        
        .password-toggle {
            cursor: pointer;
            transition: var(--transition);
        }
        
        .password-toggle:hover {
            color: var(--teal);
        }
        
        @media (max-width: 480px) {
            .login-card {
                padding: 24px 20px;
            }
        }
    </style>
</head>
<body>

    <!-- Theme Toggle -->
    <button class="theme-float" id="themeToggle" aria-label="Toggle theme">
        <i class="bi bi-moon-fill"></i>
    </button>

    <div class="login-page">
        <div class="login-container">
            <div class="login-card">
                
                <!-- Header -->
                <div class="login-header">
                    <div class="login-icon-circle">
                        <i class="bi bi-shield-lock-fill"></i>
                    </div>
                    <h1 class="login-logo">
                        Dent<span class="brand-accent">Align</span>
                    </h1>
                    <p class="login-subtitle">Admin Panel Access</p>
                </div>
                
                <!-- Error Message -->
                <div class="login-error" id="loginError">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    <span id="errorMessage">Invalid email or password</span>
                </div>
                
                <!-- Login Form -->
                <form id="loginForm" autocomplete="off">
                    <div class="mb-3">
                        <label for="email" class="form-label">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="bi bi-envelope"></i>
                            </span>
                            <input type="email" class="form-control" id="email" 
                                   placeholder="admin@dentalign.pk" required>
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label for="password" class="form-label">Password</label>
                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="bi bi-lock"></i>
                            </span>
                            <input type="password" class="form-control" id="password" 
                                   placeholder="Enter your password" required>
                            <span class="input-group-text password-toggle" id="togglePassword">
                                <i class="bi bi-eye"></i>
                            </span>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-primary-custom btn-login">
                        <i class="bi bi-box-arrow-in-right me-2"></i> Sign In
                    </button>
                </form>
                
                <!-- Help Text -->
                <p class="text-center mt-3" style="font-size: 0.78rem; color: var(--text-muted);">
                    <i class="bi bi-info-circle me-1"></i>
                    This area is restricted to authorized clinic staff only.
                </p>
            </div>
            
            <!-- Back Link -->
            <div class="back-link">
                <a href="index.html">
                    <i class="bi bi-arrow-left me-1"></i> Back to DentAlign Website
                </a>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // =============================================
        // DENTALIGN - Admin Login
        // =============================================
        
        // Theme Toggle
        const themeToggle = document.getElementById('themeToggle');
        const savedTheme = localStorage.getItem('dentalign_theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
        updateThemeIcon(savedTheme);
        
        themeToggle.addEventListener('click', () => {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('dentalign_theme', next);
            updateThemeIcon(next);
        });
        
        function updateThemeIcon(theme) {
            const icon = themeToggle.querySelector('i');
            icon.className = theme === 'dark' ? 'bi bi-sun-fill' : 'bi bi-moon-fill';
        }
        
        // Password Toggle
        document.getElementById('togglePassword').addEventListener('click', function() {
            const passwordInput = document.getElementById('password');
            const icon = this.querySelector('i');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.className = 'bi bi-eye-slash';
            } else {
                passwordInput.type = 'password';
                icon.className = 'bi bi-eye';
            }
        });
        
        // Login Credentials
        const VALID_CREDENTIALS = {
            email: 'admin@dentalign.pk',
            password: 'admin123'
        };
        
        // Login Form Handler
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorDiv = document.getElementById('loginError');
            const errorMsg = document.getElementById('errorMessage');
            
            // Hide previous error
            errorDiv.classList.remove('show');
            
            // Validate empty fields
            if (!email || !password) {
                errorMsg.textContent = 'Please fill in all fields.';
                errorDiv.classList.add('show');
                return;
            }
            
            // Validate email format
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                errorMsg.textContent = 'Please enter a valid email address.';
                errorDiv.classList.add('show');
                return;
            }
            
            // Check credentials
            if (email === VALID_CREDENTIALS.email && password === VALID_CREDENTIALS.password) {
                // Success - Show loading state
                const submitBtn = this.querySelector('button[type="submit"]');
                submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Signing in...';
                submitBtn.disabled = true;
                
                // Set admin session
                localStorage.setItem('dentalign_admin', 'true');
                localStorage.setItem('dentalign_admin_email', email);
                localStorage.setItem('dentalign_admin_login_time', new Date().toISOString());
                
                // Redirect to admin panel
                setTimeout(() => {
                    window.location.href = 'admin.html';
                }, 800);
            } else {
                // Failed login
                errorMsg.textContent = 'Invalid email or password. Please try again.';
                errorDiv.classList.add('show');
                
                // Clear password field
                document.getElementById('password').value = '';
                document.getElementById('password').focus();
            }
        });
        
        // Auto-focus email field
        document.getElementById('email').focus();
        
        // Check if already logged in
        if (localStorage.getItem('dentalign_admin') === 'true') {
            // Show auto-login message
            const form = document.getElementById('loginForm');
            form.innerHTML = `
                <div class="text-center py-3">
                    <div class="spinner-border text-teal mb-3" role="status" style="color: var(--teal) !important;">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <p style="color: var(--text-dark);">You are already logged in.</p>
                    <p style="font-size: 0.85rem; color: var(--text-light);">Redirecting to admin panel...</p>
                    <a href="admin.html" class="btn btn-primary-custom btn-sm mt-2">
                        Go to Dashboard <i class="bi bi-arrow-right ms-1"></i>
                    </a>
                </div>
            `;
            
            // Auto-redirect after 2 seconds
            setTimeout(() => {
                window.location.href = 'admin.html';
            }, 2000);
        }
        
        console.log('%c🔐 DentAlign Admin Login %c| %cReady',
            'font-weight:900; color:#0d9488;',
            '',
            'color:#64748b;');
    </script>
</body>
</html>
