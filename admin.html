<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DentAlign | Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg fixed-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">Dent<span class="brand-accent">Align</span></a>
            <span class="badge bg-teal ms-2">Admin Panel</span>
            <button class="btn btn-outline-custom btn-sm ms-auto" onclick="logout()">
                <i class="bi bi-box-arrow-right me-1"></i> Logout
            </button>
        </div>
    </nav>

    <section style="padding-top: 120px;">
        <div class="container">
            <h2 class="section-title mb-4">📊 Dashboard</h2>

            <!-- Stats -->
            <div class="row g-3 mb-4">
                <div class="col-md-3 col-6">
                    <div class="service-card text-center">
                        <h3 class="stat-number" id="todayCount">0</h3>
                        <p>Today's Appointments</p>
                    </div>
                </div>
                <div class="col-md-3 col-6">
                    <div class="service-card text-center">
                        <h3 class="stat-number" id="totalCount">0</h3>
                        <p>Total Bookings</p>
                    </div>
                </div>
                <div class="col-md-3 col-6">
                    <div class="service-card text-center">
                        <h3 class="stat-number text-warning" id="pendingCount">0</h3>
                        <p>Pending</p>
                    </div>
                </div>
                <div class="col-md-3 col-6">
                    <div class="service-card text-center">
                        <h3 class="stat-number text-success" id="confirmedCount">0</h3>
                        <p>Confirmed</p>
                    </div>
                </div>
            </div>

            <!-- Appointments Table -->
            <div class="service-card">
                <h4 class="mb-3">📅 All Appointments</h4>
                <div class="table-responsive">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Time</th>
                                <th>Patient</th>
                                <th>Service</th>
                                <th>Phone</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="appointmentsTable">
                            <tr>
                                <td colspan="7" class="text-center">No appointments found</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/admin.js"></script>
</body>

</html>
